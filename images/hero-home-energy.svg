<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d">
  <title id="t">A home with rooftop solar panels, a heat pump, a home battery and an electric car charging</title>
  <desc id="d">Flat illustration of the five renewable technologies MERV measures: solar PV on the roof, a heat pump beside the house, a wall-mounted battery, and an electric vehicle at a home charger.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4f1fa"/>
      <stop offset="1" stop-color="#f7fbfe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245a8f"/>
      <stop offset="1" stop-color="#173f66"/>
    </linearGradient>
    <clipPath id="roofclip">
      <polygon points="420,292 960,292 838,174 542,174"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="420" y="174">
      <rect width="40" height="40" fill="none" stroke="#7fb2e0" stroke-width="2" stroke-opacity="0.75"/>
    </pattern>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="1600" height="720" fill="url(#sky)"/>
  <circle cx="1400" cy="112" r="78" fill="#f9c74f" fill-opacity="0.18"/>
  <circle cx="1400" cy="112" r="48" fill="#f9c74f"/>
  <g fill="#ffffff" fill-opacity="0.95">
    <ellipse cx="300" cy="130" rx="70" ry="26"/><ellipse cx="345" cy="112" rx="48" ry="30"/><ellipse cx="255" cy="118" rx="42" ry="26"/>
    <ellipse cx="1130" cy="96" rx="58" ry="22"/><ellipse cx="1165" cy="82" rx="40" ry="24"/><ellipse cx="1092" cy="86" rx="34" ry="20"/>
  </g>

  <!-- ground and driveway -->
  <rect x="0" y="570" width="1600" height="150" fill="#dbe8d0"/>
  <polygon points="1060,570 1480,570 1560,720 990,720" fill="#e9e5dd"/>
  <line x1="0" y1="570" x2="1600" y2="570" stroke="#c6d6b8" stroke-width="3"/>

  <!-- underground energy link: battery -> heat pump -> charger -->
  <path d="M477 575 V604 H1091 V575 M1012 604 V575" fill="none" stroke="#1277a7" stroke-width="4" stroke-dasharray="10 8" stroke-opacity="0.75"/>

  <!-- house -->
  <rect x="440" y="300" width="500" height="270" fill="#f4f1ea"/>
  <rect x="440" y="550" width="500" height="20" fill="#d9d3c5"/>
  <polygon points="400,300 980,300 850,160 530,160" fill="#4b5563"/>
  <g clip-path="url(#roofclip)">
    <rect x="420" y="174" width="540" height="118" fill="url(#panel)"/>
    <rect x="420" y="174" width="540" height="118" fill="url(#grid)"/>
    <polygon points="420,292 560,174 640,174 500,292" fill="#ffffff" fill-opacity="0.08"/>
  </g>
  <rect x="400" y="296" width="580" height="10" rx="3" fill="#374151"/>
  <line x1="530" y1="160" x2="850" y2="160" stroke="#374151" stroke-width="8" stroke-linecap="round"/>

  <!-- windows and door -->
  <g fill="#cfe8f6" stroke="#ffffff" stroke-width="6">
    <rect x="490" y="330" width="90" height="70" rx="3"/>
    <rect x="655" y="330" width="90" height="70" rx="3"/>
    <rect x="820" y="330" width="90" height="70" rx="3"/>
    <rect x="530" y="440" width="100" height="90" rx="3"/>
    <rect x="800" y="440" width="100" height="90" rx="3"/>
  </g>
  <g stroke="#ffffff" stroke-width="4">
    <line x1="535" y1="330" x2="535" y2="400"/><line x1="700" y1="330" x2="700" y2="400"/><line x1="865" y1="330" x2="865" y2="400"/>
    <line x1="580" y1="440" x2="580" y2="530"/><line x1="850" y1="440" x2="850" y2="530"/>
  </g>
  <rect x="660" y="440" width="80" height="130" rx="4" fill="#1277a7"/>
  <circle cx="726" cy="510" r="5" fill="#f4f1ea"/>
  <!-- bushes -->
  <g fill="#7fb069">
    <circle cx="418" cy="556" r="20"/><circle cx="395" cy="562" r="14"/>
    <circle cx="960" cy="560" r="16"/>
  </g>

  <!-- wall-mounted home battery -->
  <path d="M477 300 V445" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <rect x="455" y="445" width="44" height="98" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <rect x="463" y="455" width="28" height="5" rx="2" fill="#22c55e"/>
  <polygon points="481,470 468,497 478,497 473,520 488,490 478,490" fill="#1277a7"/>
  <rect x="474" y="543" width="6" height="27" fill="#94a3b8"/>

  <!-- heat pump -->
  <rect x="962" y="568" width="120" height="7" rx="2" fill="#b8b2a6"/>
  <rect x="945" y="536" width="22" height="8" fill="#94a3b8"/>
  <rect x="945" y="550" width="22" height="8" fill="#94a3b8"/>
  <rect x="965" y="488" width="112" height="80" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <circle cx="1000" cy="528" r="26" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="1000" cy="528" r="8" fill="#334155"/>
  <g stroke="#334155" stroke-width="3" stroke-linecap="round">
    <line x1="1000" y1="510" x2="1000" y2="546"/><line x1="982" y1="528" x2="1018" y2="528"/>
    <line x1="987" y1="515" x2="1013" y2="541"/><line x1="1013" y1="515" x2="987" y2="541"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="1040" y1="504" x2="1064" y2="504"/><line x1="1040" y1="516" x2="1064" y2="516"/>
    <line x1="1040" y1="528" x2="1064" y2="528"/><line x1="1040" y1="540" x2="1064" y2="540"/>
    <line x1="1040" y1="552" x2="1064" y2="552"/>
  </g>

  <!-- EV charger and car -->
  <rect x="1080" y="468" width="22" height="102" rx="5" fill="#334155"/>
  <circle cx="1091" cy="484" r="5" fill="#22c55e"/>
  <polygon points="1094,495 1086,512 1091,512 1088,524 1097,506 1092,506" fill="#ffffff"/>
  <path d="M1091 530 C1091 552 1104 553 1126 522" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M1120 546 V520 Q1120 500 1140 497 L1188 490 L1226 455 Q1236 446 1250 446 H1330 Q1345 446 1355 457 L1386 490 L1420 497 Q1440 500 1440 520 V546 Q1440 552 1432 552 H1128 Q1120 552 1120 546 Z" fill="#1277a7"/>
  <polygon points="1200,490 1234,458 1278,458 1278,490" fill="#cfe8f6"/>
  <polygon points="1288,458 1332,458 1362,490 1288,490" fill="#cfe8f6"/>
  <rect x="1124" y="514" width="14" height="12" rx="2" fill="#0f2e3d"/>
  <rect x="1130" y="528" width="300" height="6" fill="#0f2e3d" fill-opacity="0.15"/>
  <circle cx="1175" cy="550" r="22" fill="#1f2937"/><circle cx="1175" cy="550" r="9" fill="#9ca3af"/>
  <circle cx="1388" cy="550" r="22" fill="#1f2937"/><circle cx="1388" cy="550" r="9" fill="#9ca3af"/>

  <!-- labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0f2e3d">
    <line x1="330" y1="205" x2="560" y2="235" stroke="#64748b" stroke-width="2"/>
    <rect x="190" y="186" width="140" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="260" y="212" text-anchor="middle">Solar PV</text>

    <line x1="330" y1="480" x2="455" y2="490" stroke="#64748b" stroke-width="2"/>
    <rect x="160" y="461" width="170" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="245" y="487" text-anchor="middle">Home battery</text>

    <line x1="1020" y1="440" x2="1020" y2="488" stroke="#64748b" stroke-width="2"/>
    <rect x="950" y="402" width="140" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1020" y="428" text-anchor="middle">Heat pump</text>

    <line x1="1300" y1="420" x2="1300" y2="446" stroke="#64748b" stroke-width="2"/>
    <rect x="1220" y="382" width="160" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1300" y="408" text-anchor="middle">EV charging</text>
  </g>
</svg>
